[project]
name = "nexus-sounds"
version = "0.1.0"
description = "Audio notification addon for Nexus Screen / Klipper 3D printers"
requires-python = ">=3.9"
dependencies = ["websockets>=10.0"]
license = {text = "GPL-3.0-only"}

[project.scripts]
nexus-sounds = "nexus_sounds.daemon:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.backends.legacy:build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
